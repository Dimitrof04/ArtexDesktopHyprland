# --- Configurações do Shell ---
# Força o Kitty a abrir diretamente com o Fish Shell
shell /usr/bin/fish

# --- Configurações de Fonte ---
font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Janela e Espaçamento ---
window_padding_width 12
background_opacity 0.65
confirm_os_window_close 0

# --- Cursor ---
cursor_shape block
cursor_blink_interval 0.5

# --- Paleta de Cores (Catppuccin Mocha) ---
background            #1e1e2e
foreground            #cdd6f4
cursor                #f5e0dc
cursor_text_color     #1e1e2e
selection_background  #313244
selection_foreground  #cdd6f4
active_tab_foreground   #000
active_tab_background   #eee
active_tab_font_style   bold
inactive_tab_foreground #444
inactive_tab_background #222
inactive_tab_font_style normal
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Cores do Terminal
color0  #45475a
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #f5c2e7
color13 #f5c2e7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #a6adc8
